name: Build APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o project.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: proj
      - run: gh release create v${{ github.run_number }} proj/app/build/outputs/apk/debug/app-debug.apk --title "DigBot ${{ github.run_number }}" --notes "debug build"
        env:
          GH_TOKEN: ${{ github.token }}
